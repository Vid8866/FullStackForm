#cloud-config
packages:
 - python3-flask
 - python3-redis
 - python3-psycopg2
 - postgresql
 - postgresql-contrib
 
runcmd:
 - cd /home/ubuntu
 - git clone https://github.com/Vid8866/FullStackForm.git
 - cd FullStackForm/
 - sudo apt install -y postgresql postgresql-contrib
#Setting up PostgreSQL user and database
 - sudo -u postgres psql <<EOF
 - CREATE USER "user" WITH PASSWORD 'pass';
 - CREATE DATABASE demo OWNER "user";
 - GRANT ALL PRIVILEGES ON DATABASE demo TO "user";
 - EOF
#redis
 - sudo apt install -y redis-server
 - sudo systemctl enable redis-server
 - sudo systemctl start redis-server
#nginx and copying confix
 - sudo apt install -y nginx
 - sudo cp application/nginx/default.conf /etc/nginx/sites-available/default
 - sudo systemctl restart nginx
#systemd service
 - sudo cp vagrant/flaskapp.service /etc/systemd/system/flaskapp.service
 - sudo systemctl daemon-reload
 - sudo systemctl enable flaskapp
 - sudo systemctl start flaskapp