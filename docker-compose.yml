services:
  app:
    build:
      context: ./application/app
    container_name: fullstackform-app
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: demo
      DATABASE_USER: user
      DATABASE_PASSWORD: pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: fullstackform-db
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: fullstackform-redis
    volumes:
      - redisdata:/data

  nginx:
    image: nginx:alpine
    container_name: fullstackform-nginx
    ports:
      - "8080:80"
    volumes:
      - ./application/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
