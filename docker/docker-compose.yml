version: "3.9"

services:
  app:
    build: 
      context: ../application/app
      dockerfile: ../../docker/app/Dockerfile
    container_name: fullstackform-app
    environment:
      DB_HOST: db
      DB_NAME: demo
      DB_USER: user
      DB_PASSWORD: pass
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
    expose:
      - "5001"

  db:
    image: postgres:16
    container_name: fullstackform-db
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: fullstackform-redis

  nginx:
    image: nginx:alpine
    container_name: fullstackform-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
